name: Flutter CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate AT validation report
        run: dart run tool/generate_at_validation_report.dart
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
